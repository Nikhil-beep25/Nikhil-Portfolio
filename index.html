    <!-- Inline Theme Synchronization Script (Default: Lite / Day Mode) -->
    <script>
      (function() {
        try {
          const manual = localStorage.getItem('minecraft-portfolio-manual-theme');
          const isNight = manual === 'true' && localStorage.getItem('minecraft-portfolio-night') === 'true';
          const root = document.documentElement;
          if (isNight) {
            root.classList.add('night-mode');
            root.classList.remove('day-mode');
          } else {
            root.classList.add('day-mode');
            root.classList.remove('night-mode');
          }
        } catch (e) {
          document.documentElement.classList.add('day-mode');
        }
      })();
    </script>
